# Ground truth: pet_loyalty — devoted pet owners with very low refund and strong memory
# Pet: 140-day memory, 0.003 decay, 30-day purchase cycle, UGC boosted
# TRAIN set — based on loyal_niche template
seed: 405

simulation:
  start_date: "2023-01-01"
  end_date: "2026-01-01"

num_customers: 400
num_products: 18
creatives: 22

base_ctr: 0.018
base_conversion: 0.030
base_refund_rate: 0.04

budget_tier: mid
budget_concentration: 2.0
budget_volatility: 0.22
cpm: 14.0
lpv_rate: 0.72

brand_lifecycle:
  enabled: true
  market_size: 200000
  initial_phase: launch
  growth_velocity_threshold: 15
  growth_repeat_stability_cv: 0.3
  maturation_penetration_pct: 0.15
  maturation_cpa_rise_pct: 0.40
  saturation_cpa_ltv_ratio: 0.75
  decline_repeat_decay_pct: 0.15
  decline_cpa_multiplier: 1.5
  phase_effects:
    maturation: {ctr_mult: 0.95, cvr_mult: 1.0, refund_mult: 0.8, repeat_mult: 1.4, cpa_mult: 1.1}
    saturation: {ctr_mult: 0.90, cvr_mult: 0.90, refund_mult: 0.9, repeat_mult: 1.2, cpa_mult: 1.2}
    decline:    {ctr_mult: 0.85, cvr_mult: 0.80, refund_mult: 1.0, repeat_mult: 1.0, cpa_mult: 1.3}

population_dynamics:
  enabled: true
  daily_inflow_base: 30
  inflow_decay_rate: 0.0004
  quality_drift_rate: 0.00004
  quality_drift_cap: 0.05
  pool_expiry_days: 365

diagnostic_output: true

lag_structure:
  trust_ema_weight: 0.85
  refund_timing_modes:
    - [5, 2, 0.6]
    - [18, 5, 0.4]

momentum:
  enabled: true
  revenue_autocorrelation: 0.7
  ctr_autocorrelation: 0.5
  conversion_autocorrelation: 0.6
  seasonality:
    weekly_pattern: [0.85, 0.95, 1.0, 1.0, 1.05, 1.1, 1.05]
    monthly_pattern: [0.9, 0.85, 0.95, 1.0, 1.0, 0.95, 0.9, 0.9, 1.05, 1.1, 1.15, 1.3]

feedback_loops:
  enabled: true
  pressure_ramp_rate: 0.015
  pressure_decay_rate: 0.012
  pressure_quality_penalty: 0.08
  revenue_target_window_days: 30

distribution_realism:
  enabled: true
  spending_propensity_sigma: 0.45
  creative_quality_sigma: 0.4

memory:
  brand_memory_decay_after_days: 140
  brand_memory_decay_rate: 0.003
  bad_shipping_permanent_penalty: 0.15
  discount_only_fullprice_penalty: 0.4
  satisfaction_memory_decay_rate: 0.003
  disappointment_memory_decay_rate: 0.004
  loyalty_regression_rate: 0.002
  loyalty_baseline: 0.5
  quality_expectation_regression_rate: 0.002
  quality_expectation_baseline: 0.5
  price_sensitivity_regression_rate: 0.002
  price_sensitivity_baseline: 0.5
  purchase_inactivity_decay_after_days: 30

quality_expectation_calibration_rate: 0.01
fullprice_desensitization_rate: 0.005
loyalty_disappointment_erosion: 0.02

long_term_accumulators:
  ctr_erosion_per_churn: 0.015
  discount_dependency_cvr_penalty: 0.25
  trust_floor_from_refunds: 0.50
  exhaustion_cpa_multiplier: 1.4

creative_lifecycle:
  enabled: true
  novelty_bonus_duration_impressions: 5000
  ramp_end_impressions: 10000
  plateau_duration_impressions: 50000
  fatigue_half_life_impressions: 100000
  min_performance_floor: 0.2

creative_type_multipliers:
  image:      {ctr_multiplier: 1.0, cvr_multiplier: 1.0, fatigue_multiplier: 0.10}
  video:      {ctr_multiplier: 1.2, cvr_multiplier: 1.1, fatigue_multiplier: 0.20}
  carousel:   {ctr_multiplier: 1.1, cvr_multiplier: 1.05, fatigue_multiplier: 0.15}
  ugc:        {ctr_multiplier: 1.60, cvr_multiplier: 1.50, fatigue_multiplier: 0.40}
  collection: {ctr_multiplier: 1.0, cvr_multiplier: 1.0, fatigue_multiplier: 0.08}
